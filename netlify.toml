# Anteprima del sito goKlient su Netlify.
[build]
  command = "npm run build"
  publish = "dist"

# Astro 7.4.7 richiede Node 22.23.4 o successivo: con una versione piu' vecchia la build si ferma
# ("Node.js ... is not supported by Astro!") e l'anteprima Netlify fallisce.
[build.environment]
  NODE_VERSION = "22.23.4"

# Il noindex dell'anteprima non sta piu' qui: lo scrive la build in dist/_headers finche' config.anteprima e' true
# (vedi astro.config.mjs). Sulle anteprime delle PR Netlify aggiunge comunque un suo noindex.

# File con l'impronta nel nome (CSS, JavaScript, caratteri): cambiano nome a ogni modifica, quindi il browser
# puo' tenerli per un anno senza ricontrollarli.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immagini: il nome resta uguale anche quando si sostituisce il file, quindi cache breve (un giorno),
# poi il browser le ricontrolla in sottofondo.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
