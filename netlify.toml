# Anteprima del sito goKlient su Netlify.
[build]
  command = "npm run build"
  publish = "dist"

# Astro 7.4.7 richiede Node 22.23.4 o successivo: con una versione piu' vecchia la build si ferma
# ("Node.js ... is not supported by Astro!") e l'anteprima Netlify fallisce.
[build.environment]
  NODE_VERSION = "22.23.4"

# Finche' config.anteprima e' true: nessuna indicizzazione (oltre a meta noindex e robots.txt).
# Da togliere al lancio vero.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
